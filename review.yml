actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists and no streaming (SSE/WebSocket)
    transport is documented. Asynchronous generation uses HTTP callbacks and a
    pollable job-status endpoint, so no AsyncAPI document was authored.
