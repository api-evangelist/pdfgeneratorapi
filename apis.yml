aid: pdfgeneratorapi
url: https://raw.githubusercontent.com/api-evangelist/pdfgeneratorapi/refs/heads/main/apis.yml
name: PDF Generator API
kind: company
description: PDF Generator API is a template-based document and PDF generation service.
  A drag-and-drop browser template editor plus a REST API let developers merge JSON
  data with reusable templates to produce PDFs, HTML, and other documents synchronously,
  asynchronously, or in batches, organized across multi-tenant workspaces.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- PDF
- Document Generation
- Templates
- Reporting
- Workspaces
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
