specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: PDF Generator API
providerId: pdfgeneratorapi
created: '2026-06-25'
modified: '2026-06-25'
reconciled: true
tags:
- PDF
- Document Generation
- Templates
- Reporting
- Workspaces
- Plans
description: >-
  PDF Generator API uses tiered subscription plans (billed annually) metered
  primarily by monthly document credits, with per-plan caps on the number of
  templates and workspaces. Individual plans (Creator, Low Usage) target single
  users; Team plans (Starter, Basic, Professional, Premium, Enterprise) add
  workspaces and advanced template management. All paid plans include a 14-day
  free trial and unlimited test documents. Prices are listed in EUR.
notes: >-
  Prices and credit/template/workspace limits as published on the pricing page
  with annual billing; verify the current catalog at pdfgeneratorapi.com/pricing
  during reconciliation. One document credit is consumed per generated document.
sources:
- https://pdfgeneratorapi.com/pricing
- https://docs.pdfgeneratorapi.com/v4/
plans:
- id: pdfgeneratorapi-creator
  name: Creator
  type: subscription
  description: >-
    Individual plan with 50 monthly document credits and up to 5 templates.
  entries:
  - label: Subscription
    name: creator
    type: flat
    metric: documents
    limit: 50
    timeFrame: month
    geo: global
    unit: 1
    price: EUR 80 / year
    userMultiplied: false
  elements:
  - name: 50 documents / month
  - name: 5 templates
  - name: Unlimited test documents
  - name: 14-day free trial
